# =============================================================================
# CI workflow
# =============================================================================
#
# Runs Mozilla's `web-ext lint` and a build on every push to `main` and on
# every pull request. Catches broken manifests, unsafe assignments, etc.
# before they ship in a release.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint extension
        run: npm run lint

      - name: Build extension (smoke test)
        run: npm run build

      - name: Upload .zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: extension-build-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
